<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>JAKKON Asset Management System</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--n:#0B3B6F;--b:#145A9C;--lb:#EAF3FF;--bg:#F5F8FC;--t:#172B4D;--t2:#64748B;--ok:#16A36A;--wr:#F59E0B;--er:#DC3545;--bd:#E2E8F0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 "Plus Jakarta Sans",Inter,system-ui,sans-serif}
#side{position:fixed;inset:0 auto 0 0;width:240px;background:#fff;border-right:1px solid var(--bd);padding:18px 14px;overflow:auto;z-index:20;transition:transform .2s}
#side img{width:170px;margin:4px 0 22px 6px;display:block}
#side a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--t2);text-decoration:none;font-weight:600;margin-bottom:2px}
#side a.sub{padding-left:38px;font-weight:500}#side a:hover{background:var(--lb)}#side a.on{background:var(--n);color:#fff}
#main{margin-left:240px;padding:18px 24px 40px}
.top{display:flex;gap:12px;align-items:center;margin-bottom:18px}.top input{flex:1;max-width:480px}
#burger{display:none}
input,select,textarea{font:inherit;color:var(--t);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--b);outline-offset:1px}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(15,40,80,.06)}
.hero{background:linear-gradient(110deg,var(--n),var(--b));color:#fff;border-radius:16px;padding:26px 28px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:24px;font-weight:800}.hero p{margin:0;opacity:.85}
.b1,.b2{font:inherit;font-weight:600;border-radius:10px;padding:9px 16px;cursor:pointer;border:1px solid var(--n)}
.b1{background:var(--n);color:#fff}.b2{background:#fff;color:var(--n);border-color:var(--bd)}.hero .b2{border-color:#fff}
.b1:hover{background:var(--b)}.sm{padding:4px 10px;font-size:12px}.dng{color:var(--er)}
.g{display:grid;gap:14px;margin-bottom:16px}.g6{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.k{font-size:26px;font-weight:800}.kl{color:var(--t2);font-weight:600;font-size:13px}
h2{font-size:16px;margin:0 0 12px}h3{margin:0 0 12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--t2);font-size:12px;font-weight:700;background:#F8FAFD}th.s{cursor:pointer}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--lb);color:var(--b)}
.tag.g1{background:#E3F6EE;color:var(--ok)}.tag.g2{background:var(--lb);color:var(--b)}.tag.g3{background:#FEF3DC;color:#B97700}.tag.g4{background:#FBE5E7;color:var(--er)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar>*{width:auto}.bar input{flex:1;min-width:160px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.donut{width:150px;height:150px;border-radius:50%;margin:auto}.lg{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}.lg i{width:10px;height:10px;border-radius:50%}
.hb{height:8px;border-radius:9px;background:var(--lb);overflow:hidden}.hb b{display:block;height:100%;background:var(--b)}
#bk{position:fixed;inset:0;background:rgba(15,30,60,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#md{background:#fff;border-radius:16px;padding:22px;width:560px;max-width:100%;max-height:92vh;overflow:auto}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg label{font-weight:600;font-size:12px;color:var(--t2)}.fg label>*{margin-top:4px;font-weight:400}.fg textarea{grid-column:span 2}
.ra{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#ts{position:fixed;right:16px;bottom:16px;z-index:60;display:grid;gap:8px}#ts div{background:var(--ok);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600}#ts .err{background:var(--er)}
.pg{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:12px;color:var(--t2)}
@media(max-width:860px){#side{transform:translateX(-100%)}#side.open{transform:none}#main{margin-left:0;padding:14px}#burger{display:block;width:auto}.fg{grid-template-columns:1fr}.fg textarea{grid-column:auto}}
@media print{#side,.top,.bar,.ra,.no{display:none!important}#main{margin:0}}
</style></head><body>

function stockF(id,type){if(!guard('stock'))return;const a=A(id);form({Tambah:'Tambah quantity',Kurang:'Kurangi quantity',Koreksi:'Koreksi jumlah stok'}[type]+' - '+esc(a.name),[{k:'n',l:type=='Koreksi'?'Jumlah stok yang benar':'Jumlah',t:'number',min:type=='Koreksi'?a.used:1,v:type=='Koreksi'?a.qty:1,req:1},{k:'why',l:'Alasan perubahan',t:'area',req:1}],v=>{

<div class=card><h2>${esc(a.name)}</h2><div class="fg" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${f.map(([k,v])=>`<div><div class=kl>${k}</div>${k=='Status'||k=='Kondisi'?tg(v):esc(v)}</div>`).join('')}</div></div>

if(v.res=='Tidak Lulus'){a.status='Rusak'}else if(v.res=='Perlu Perbaikan'){a.status='Dalam Perawatan';D.maint.push({id:Date.now(),aid:a.id,dmg:v.note||'Hasil QC: perlu perbaikan',act:'',cost:0,start:v.t,end:'',st:'Menunggu Perbaikan'})}else if(a.status=='Rusak')a.status='Tersedia';
log('Quality Check selesai',a.name+': '+v.res);save();toast('Hasil pemeriksaan disimpan, status aset diperbarui');R()})}
function maint(){return`<div class=bar>${can('maint')?'<button class=b1 onclick=mtF()>+ Jadwal Maintenance</button>':''}</div><div class=card><div class=tw><table><tr><th>Aset<th>Kerusakan<th>Tindakan<th>Biaya<th>Mulai<th>Selesai<th>Status${can('maint')?'<th>Ubah status':''}${D.maint.map(m=>`<tr><td>${esc(A(m.aid)?.name)}<td>${esc(m.dmg)}<td>${esc(m.act)}<td>Rp ${m.cost.toLocaleString('id-ID')}<td>${m.start}<td>${m.end||'-'}<td>${tg(m.st)}${can('maint')?`<td><select onchange="mtS(${m.id},this.value)" style="width:auto">${['Menunggu Perbaikan','Dalam Proses','Selesai','Tidak Dapat Diperbaiki'].map(s=>`<option ${s==m.st?'selected':''}>${s}</option>`).join('')}</select>`:''}`).join('')}</table></div></div>`}
function mtS(id,s){if(!guard('maint'))return;const m=D.maint.find(x=>x.id==id),a=A(m.aid);m.st=s;m.end=s=='Selesai'||s=='Tidak Dapat Diperbaiki'?T:'';a.status=s=='Selesai'?'Tersedia':s=='Tidak Dapat Diperbaiki'?'Rusak':'Dalam Perawatan';log('Maintenance '+s,a.name);save();toast('Status maintenance diperbarui');R()}
function mtF(){if(!guard('maint'))return;form('Jadwal maintenance',[{k:'id',l:'Aset',t:'select',o:live().map(a=>a.id+' - '+a.name)},{k:'dmg',l:'Jenis kerusakan',req:1},{k:'act',l:'Tindakan perbaikan'},{k:'cost',l:'Biaya (Rp)',t:'number',v:0},{k:'start',l:'Tanggal mulai',t:'date',v:T,req:1}],v=>{const a=A(parseInt(v.id));D.maint.push({id:Date.now(),aid:a.id,dmg:v.dmg,act:v.act,cost:v.cost,start:v.start,end:'',st:'Menunggu Perbaikan'});a.status='Dalam Perawatan';log('Maintenance dijadwalkan',a.name);save();toast('Maintenance dicatat, aset tidak lagi dihitung tersedia');R()})}
let RT='Total aset',RF='',RE='';
const inR=d=>(!RF||d>=RF)&&(!RE||d<=RE);
function repRows(){const L=live().filter(a=>inR(a.date)),grp=k=>Object.entries(L.reduce((o,a)=>(o[a[k]]=o[a[k]]||{n:0,q:0},o[a[k]].n++,o[a[k]].q+=a.qty,o),{})).map(([x,v])=>({[k=='cat'?'Kategori':k=='loc'?'Lokasi':'Kondisi']:x,'Jumlah item':v.n,'Total quantity':v.q}));
return{'Total aset':()=>L.map(rowO),'Per kategori':()=>grp('cat'),'Quantity':()=>L.map(a=>({Kode:a.code,Nama:a.name,Total:a.qty,Digunakan:a.used,Tersedia:av(a)})),'Per lokasi':()=>grp('loc'),'Kondisi aset':()=>grp('cond'),'Quality Check':()=>D.qcs.filter(q=>inR(q.t)).map(q=>({Tanggal:q.t,Aset:A(q.id)?.name,Pemeriksa:q.by,Hasil:q.res,Catatan:q.note})),'Maintenance':()=>D.maint.filter(m=>inR(m.start)).map(m=>({Aset:A(m.aid)?.name,Kerusakan:m.dmg,Biaya:m.cost,Mulai:m.start,Status:m.st})),'Perubahan stok':()=>D.moves.filter(m=>inR(m.t)).map(m=>({Tanggal:m.t,Aset:A(m.id)?.name,Tipe:m.type,Perubahan:m.n,Sesudah:m.after,Alasan:m.why,Oleh:m.u})),'Aset rusak':()=>L.filter(a=>a.status=='Rusak'||a.cond.startsWith('Rusak')).map(rowO)}[RT]()}
function reports(){const r=repRows(),h=Object.keys(r[0]||{});return`<div class=bar><select onchange="RT=this.value;R()">${['Total aset','Per kategori','Quantity','Per lokasi','Kondisi aset','Quality Check','Maintenance','Perubahan stok','Aset rusak'].map(x=>`<option ${x==RT?'selected':''}>${x}</option>`).join('')}</select><input type=date value="${RF}" onchange="RF=this.value;R()" style="width:auto" aria-label="Dari"><input type=date value="${RE}" onchange="RE=this.value;R()" style="width:auto" aria-label="Sampai"><button class=b2 onclick="exp(repRows(),RT)">Export Excel</button><button class=b2 onclick="print()">Export PDF</button></div><div class=card><h2>Laporan ${RT}</h2><div class=tw><table><tr>${h.map(x=>`<th>${x}`).join('')}${r.map(o=>`<tr>${h.map(x=>`<td>${esc(o[x])}`).join('')}`).join('')||'<tr><td style="color:var(--t2)">Tidak ada data pada periode ini.'}</table></div></div>`}
async function exp(rows,name){if(!rows.length)return toast('Tidak ada data untuk diexport','err');const h=Object.keys(rows[0]),csv='\ufeff'+[h,...rows.map(o=>h.map(k=>o[k]))].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:'jakkon-'+name.toLowerCase().replace(/\s+/g,'-')+'.csv',data:csv});toast('File siap disimpan (CSV, bisa dibuka di Excel)')}catch(e){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='jakkon-'+name.toLowerCase().replace(/\s+/g,'-')+'.csv';a.click();toast('File diunduh (CSV, bisa dibuka di Excel)')}catch(x){toast('Download tidak tersedia di tampilan ini','err')}}}
function users(){const ad=can('user');return`<div class=bar>${ad?'<button class=b1 onclick=usF()>+ Pengguna</button>':''}</div><div class=card><div class=tw><table><tr><th>Nama<th>Peran<th>Hak akses${D.users.map(u=>`<tr><td>${esc(u.n)}<td>${ad?`<select onchange="usR('${esc(u.n)}',this.value)" style="width:auto">${Object.keys(P).map(r=>`<option ${r==u.r?'selected':''}>${r}</option>`).join('')}</select>`:tg(u.r)}<td>${{Administrator:'Seluruh fitur, pengguna, kategori',Staff:'Lihat, tambah/edit aset, stok, QC, maintenance',Viewer:'Hanya melihat data'}[u.r]}`).join('')}</table></div></div>`}
function usR(n,r){if(!guard('user'))return;D.users.find(u=>u.n==n).r=r;log('Peran diubah',n+' menjadi '+r);save();R()}
function usF(){if(!guard('user'))return;form('Tambah pengguna',[{k:'n',l:'Nama',req:1},{k:'r',l:'Peran',t:'select',o:Object.keys(P)}],v=>{D.users.push(v);log('Pengguna ditambahkan',v.n);save();R()})}
function settings(){return`<div class=card><h2>Pengaturan</h2><p>Data prototype tersimpan di browser ini dan tetap ada setelah refresh. Koneksi Supabase belum dipasang pada prototype ini.</p><button class="b2 dng" onclick="if(guard('user'))ask('Reset seluruh data ke contoh awal?',()=>{D=seed();save();toast('Data direset');R()})">Reset data contoh</button></div>`}
P.Administrator='*';R();
</script></body></html>
